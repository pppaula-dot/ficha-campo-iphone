function upgradeOrnamentalDefinition(def){
 if(!def||def.profile!=='ROCHA_ORNAMENTAL_BLOCO'||!Array.isArray(def.sections))return def;

function upgradeDynamicState(f){
 if(!f||!f.dynamic||!f.definition)return;
 upgradeOrnamentalDefinition(f.definition);
 const s8=f.sections&&f.sections[8],s9=f.sections&&f.sections[9];

}
function repairDb(x){
 if(!x||x.schema!==1)return null;if(!x.forms||typeof x.forms!=='object')x.forms={};
 for(const f of Object.values(x.forms)){
  if(!f||typeof f!=='object')continue;if(!f.sections||typeof f.sections!=='object')f.sections={};
  if(f.dynamic)upgradeDynamicState(f);
  const total=(f.dynamic&&f.definition&&Array.isArray(f.definition.sections))?f.definition.sections.length:12;
  for(let i=1;i<=total;i++){
   if(!f.sections[i]){f.sections[i]=f.dynamic?{definitionId:(f.definition.sections[i-1]||{}).id||('sec'+i),values:{},completed:false,photos:[],audios:[],itemExtras:{}}:emptySectionState()}
   const s=f.sections[i];if(!Array.isArray(s.photos))s.photos=[];if(!Array.isArray(s.audios))s.audios=[];if(!s.itemExtras||typeof s.itemExtras!=='object')s.itemExtras={};
   if(f.dynamic){if(!s.values||typeof s.values!=='object')s.values={};const sd=f.definition.sections[i-1]||{};for(const fld of (sd.items||[])){if(!Object.prototype.hasOwnProperty.call(s.values,fld.id))s.values[fld.id]=dynEmptyForField(fld);if(fld.companion_date&&!Object.prototype.hasOwnProperty.call(s.values,fld.id+'_date'))s.values[fld.id+'_date']='';if(fld.companion_text&&!Object.prototype.hasOwnProperty.call(s.values,fld.id+'_text'))s.values[fld.id+'_text']=''}}
   for(const ph of s.photos)if(typeof ph.clientReport!=='boolean')ph.clientReport=false;
   for(const e of Object.values(s.itemExtras)){if(!e||typeof e!=='object')continue;if(typeof e.note!=='string')e.note=String(e.note||'');if(!Array.isArray(e.photos))e.photos=[];for(const ph of e.photos)if(typeof ph.clientReport!=='boolean')ph.clientReport=false}
   if(s.values&&typeof s.values==='object')for(const v of Object.values(s.values))if(Array.isArray(v))for(const row of v||[])for(const ph of (row&&row._photos||[]))if(typeof ph.clientReport!=='boolean')ph.clientReport=false;
  }
  if(!f.dynamic){if(!Array.isArray(f.traffic))f.traffic=[];for(const r of f.traffic){if(!Array.isArray(r.photos))r.photos=[];for(const ph of r.photos)if(typeof ph.clientReport!=='boolean')ph.clientReport=false}}
 }
 return x;
}
function loadDb(){

 return{schema:1,forms:{},createdAt:new Date().toISOString()};
}

function renderNewSelect(){setTop('Nova ficha',`go('home')`);footer('');document.getElementById('app').innerHTML=`<div class="card"><h3>Escolha o empreendimento</h3><div class="muted" style="margin-bottom:12px">A ficha será aberta com os dados próprios do empreendimento. Depois poderemos acrescentar outras empresas nesta mesma lista.</div><div class="sectionTools" style="display:grid;grid-template-columns:1fr;gap:10px"><button class="btn primary" onclick="createForm('gransal')"><b>GRANSAL</b><br><span style="font-weight:400">GRANSAL GRANITOS ARACRUZ LTDA</span></button><button class="btn" onclick="createForm('cavaliere')"><b>CAVALIERE</b><br><span style="font-weight:400">INDÚSTRIA DE MÁRMORES CAVALIERE LTDA</span></button></div></div>`}
function createForm(templateKey){const f=newForm(templateKey);db.forms[f.id]=f;touch(f);go('header',{formId:f.id})}
function deleteForm(id){const f=db.forms[id];if(!f)return;if(confirm('Remover esta ficha do aparelho? Antes de apagar, confira se o pacote completo já foi exportado.')){delete db.forms[id];saveDb();renderHome()}}
function setField(name,val){const f=current();if(!f)return;f[name]=val;if(name==='anm'&&!f.plate.anm)f.plate.anm=val;touch(f)}
function setPlate(name,val){const f=current();f.plate[name]=val;touch(f)}
function captureHeaderGps(){if(!native())return alert('GPS disponível no aplicativo instalado.');locationContext={type:'header',formId:route.formId};Android.captureLocation('header')}
function renderHeader(){const f=current();if(!f)return go('home');setTop('Identificação da ficha',`go('home')`);footer(`<button class="btn primary" onclick="go('grid',{formId:'${f.id}'})">Ir para os 12 itens</button>`);document.getElementById('app').innerHTML=`
<div class="card"><h3>Identificação</h3>
<label>Empresa</label><input value="${esc(f.company)}" oninput="setField('company',this.value)">
<div class="row"><div><label>Localidade</label><input value="${esc(f.locality)}" oninput="setField('locality',this.value)"></div><div><label>Município</label><input value="${esc(f.municipality)}" oninput="setField('municipality',this.value)"></div></div>
<div class="row"><div><label>ANM</label><input value="${esc(f.anm)}" oninput="setField('anm',this.value)"></div><div><label>Licença</label><input value="${esc(f.license)}" oninput="setField('license',this.value)"></div></div>
<label>UTM — SIRGAS 2000 / 24S</label><div class="row"><input placeholder="E" inputmode="numeric" value="${esc(f.utmE)}" oninput="setField('utmE',this.value)"><input placeholder="N" inputmode="numeric" value="${esc(f.utmN)}" oninput="setField('utmN',this.value)"><button class="btn" onclick="captureHeaderGps()">Capturar GPS</button></div>
<div class="row"><div><label>Data</label><input type="date" value="${esc(f.date)}" oninput="setField('date',this.value)"></div><div><label>Substância</label><input value="${esc(f.substance)}" oninput="setField('substance',this.value)"></div><div><label>Uso</label><input value="${esc(f.use)}" oninput="setField('use',this.value)"></div></div>
<label>Responsável</label><input value="${esc(f.responsible)}" oninput="setField('responsible',this.value)">
<div class="row"><div><label>Vôo recente?</label><select onchange="setField('recentFlight',this.value)"><option value="" ${!f.recentFlight?'selected':''}>Selecione</option><option ${f.recentFlight==='Sim'?'selected':''}>Sim</option><option ${f.recentFlight==='Não'?'selected':''}>Não</option></select></div><div><label>Data do vôo</label><input type="date" value="${esc(f.flightDate)}" oninput="setField('flightDate',this.value)"></div></div>
</div>
<div class="card"><div class="notice"><b>Modelo selecionado:</b> ${esc(templateFor(f).short)}. Os dados pré-preenchidos permanecem editáveis e os campos não conhecidos ficam livres para o preenchimento em campo.</div></div>`}
function renderGrid(){const f=current();if(!f)return go('home');setTop('Orientação Técnica de Lavra',`go('home')`);const done=Object.values(f.sections).filter(s=>s.completed).length;let h=`<div class="card"><div class="statusBar"><b>${esc(f.company)}</b><span class="badge ${done===12?'done':''}">${done}/12 concluídos</span></div><div class="muted">${esc(f.locality)} • ${esc(f.municipality)} • ANM ${esc(f.anm)} • ${esc(fmtDate(f.date))}</div><div class="sectionTools"><button class="btn small" onclick="go('header',{formId:'${f.id}'})">Editar cabeçalho</button></div></div><div class="card"><h3>Itens da ficha</h3><div class="grid">`;for(let i=1;i<=12;i++)h+=`<button class="tile ${f.sections[i].completed?'done':''}" title="${esc(SECTION_NAMES[i])}" onclick="go('section',{formId:'${f.id}',section:${i}})"><span class="tileNum">${i}</span><span class="tileText">${esc(TILE_LABELS[i]||tileLabel(SECTION_NAMES[i],i))}</span></button>`;h+=`</div><div class="tiny" style="margin-top:8px">Azul = item marcado como concluído. É possível reabrir e alterar.</div></div>`;h+=`<div class="card"><h3>Relatórios</h3><div class="row"><button class="btn primary" onclick="shareReport('all')">Interno — todas as fotos</button><button class="btn" onclick="shareReport('none')">Cliente — sem fotos</button><button class="btn" onclick="shareReport('selected')">Cliente — fotos selecionadas</button></div><div class="tiny" style="margin-top:8px">Nas fotos de cada item, marque <b>Incluir no relatório do cliente</b> somente quando quiser que aquela imagem apareça na versão selecionada.</div></div><div class="card"><h3>Arquivos completos</h3><div class="row"><button class="btn" onclick="shareArchive()">Enviar fotos/áudios</button><button class="btn primary" onclick="shareComplete()">Enviar ficha completa</button></div><div class="tiny" style="margin-top:8px">A ficha completa reúne JSON, os 3 relatórios, todas as fotos e todos os áudios em um único ZIP.</div></div>`;document.getElementById('app').innerHTML=h;footer('')}
function checkHtml(sec,key,text){return `<label class="checkline"><input type="checkbox" ${sec.checks[key]?'checked':''} onchange="setCheck('${key}',this.checked)"><span class="checktext">${esc(text)}</span></label>`}
function setCheck(key,val){const f=current(),s=f.sections[route.section];s.checks[key]=!!val;touch(f)}
function setSub(key,val){const f=current(),s=f.sections[route.section];s.subs[key]=!!val;touch(f)}
function setDetail(key,val){const f=current(),s=f.sections[route.section];s.details[key]=val;touch(f)}
function setSecText(name,val){const f=current(),s=f.sections[route.section];s[name]=val;touch(f)}
function subHtml(sec,parentIdx,opts){let h='<div class="subopts">';opts.forEach((o,j)=>h+=`<label class="checkline"><input type="checkbox" ${sec.subs[parentIdx+'_'+j]?'checked':''} onchange="setSub('${parentIdx}_${j}',this.checked)"><span class="checktext">${esc(o)}</span></label>`);return h+'</div>'}
function evidenceHtml(secNo){const f=current(),s=f.sections[secNo];let h=`<div class="evidence"><b>Evidências do item</b><div class="sectionTools"><button class="btn small" onclick="takePhoto(${secNo})">Adicionar foto</button><button class="btn small" onclick="toggleAudio(${secNo})">${audioContext&&audioContext.formId===f.id&&audioContext.section===secNo?'Parar áudio':'Gravar áudio'}</button></div>`;if(s.photos.length){h+='<div class="thumbs">';s.photos.forEach((ph,i)=>{let data='';try{if(native())data=Android.imageDataUrl(ph.path,700)}catch(e){}h+=`<div class="thumb">${data?`<img src="${data}">`:''}<div class="filename">${esc(ph.name||'Foto')}</div><label class="checkline" style="border:0;padding:6px 0 0"><input type="checkbox" ${ph.clientReport?'checked':''} onchange="setPhotoClient(${secNo},${i},this.checked)"><span class="checktext">Incluir no relatório do cliente</span></label></div>`});h+='</div>'}for(const a of s.audios)h+=`<div class="audioItem">Áudio: ${esc(a.name||'arquivo')}</div>`;return h+'</div>'}
function ensureItemExtra(secNo,key){const f=current(),s=f&&f.sections&&f.sections[secNo];if(!s)return{note:'',photos:[]};if(!s.itemExtras||typeof s.itemExtras!=='object')s.itemExtras={};if(!s.itemExtras[key]||typeof s.itemExtras[key]!=='object')s.itemExtras[key]={note:'',photos:[]};const e=s.itemExtras[key];if(typeof e.note!=='string')e.note=String(e.note||'');if(!Array.isArray(e.photos))e.photos=[];return e}
function setItemExtraNote(secNo,key,val){const f=current(),e=ensureItemExtra(secNo,key);e.note=val;touch(f)}
function setItemExtraPhotoClient(secNo,key,i,val){const f=current(),e=ensureItemExtra(secNo,key),ph=e.photos[i];if(!ph)return;ph.clientReport=!!val;touch(f)}
function itemExtraThumbs(secNo,key){const e=ensureItemExtra(secNo,key);if(!e.photos.length)return'';let h='<div class="thumbs">';e.photos.forEach((ph,i)=>{let data='';try{if(native())data=Android.imageDataUrl(ph.path,700)}catch(err){}h+=`<div class="thumb">${data?`<img src="${data}">`:''}<div class="filename">${esc(ph.name||'Foto')}</div><label class="checkline" style="border:0;padding:6px 0 0"><input type="checkbox" ${ph.clientReport?'checked':''} onchange="setItemExtraPhotoClient(${secNo},'${jsq(key)}',${i},this.checked)"><span class="checktext">Incluir no relatório do cliente</span></label></div>`});return h+'</div>'}
function itemExtraHtml(secNo,key,label=''){const e=ensureItemExtra(secNo,key);return `<div class="itemExtra"><div class="tiny"><b>Registro deste subitem${label?' — '+esc(label):''}</b></div><label>Observações</label><textarea oninput="setItemExtraNote(${secNo},'${jsq(key)}',this.value)">${esc(e.note)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictateItemExtra(${secNo},'${jsq(key)}')">Ditar observação</button><button class="btn small" onclick="takeItemExtraPhoto(${secNo},'${jsq(key)}')">Adicionar foto</button></div>${itemExtraThumbs(secNo,key)}</div>`}
function dictateItemExtra(secNo,key){if(!native())return alert('Ditado disponível no aplicativo instalado.');const f=current();Android.dictate('itemExtra:'+f.id+':'+secNo+':'+encodeURIComponent(key))}
function takeItemExtraPhoto(secNo,key){if(!native())return alert('Câmera disponível no aplicativo instalado.');const f=current();ensureItemExtra(secNo,key);photoContext={type:'itemExtra',formId:f.id,section:secNo,extraKey:key};const process=(typeof isDynamic==='function'&&isDynamic(f))?dynProcess(f):(f.anm||'sem-ANM'),company=(typeof isDynamic==='function'&&isDynamic(f))?dynCompany(f):(f.company||'Sem empresa'),date=(typeof isDynamic==='function'&&isDynamic(f))?dynDate(f):(f.date||TODAY());Android.takePhoto(process,company,f.id,String(secNo),'SUBITEM_'+key,date)}
function itemExtraReportHtml(s,key,mode='all'){const e=s&&s.itemExtras&&s.itemExtras[key];if(!e)return'';const photos=photosForMode(e.photos||[],mode),note=String(e.note||'').trim();if(!note&&!photos.length)return'';let h='<div class="subitem" style="margin-top:6px"><b>Observações:</b> '+(note?esc(note).replace(/\n/g,'<br>'):'—');if(photos.length)h+='<br><b>Fotos:</b><br>'+reportPhotoFigures(photos,'all');return h+'</div>'}
function obsHtml(secNo,label='Obs.') {const s=current().sections[secNo];return `<label>${esc(label)}</label><textarea oninput="setSecText('note',this.value)">${esc(s.note)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictate('note')">Ditar texto</button></div>`}
function renderSection(n){const f=current();if(!f)return go('home');const s=f.sections[n];setTop(`${n}. ${SECTION_NAMES[n]}`,`go('grid',{formId:'${f.id}'})`);let body='';if(n===1){ACCESS.forEach((x,i)=>body+=checkHtml(s,'a'+i,x));body+=`<div class="checkline"><input type="checkbox" ${s.checks['a_other']?'checked':''} onchange="setCheck('a_other',this.checked)"><div style="flex:1"><div class="checktext">Outro / linha em branco da ficha</div><input style="margin-top:6px" value="${esc(s.other)}" oninput="setSecText('other',this.value)"><div class="sectionTools"><button class="btn small" onclick="dictate('other')">Ditar Outro</button></div></div></div>`+obsHtml(n)}
if(n===2){body+='<div class="notice">Os nomes das estruturas são títulos. A marcação fica somente em <b>Manutenção</b> e <b>Implantar</b>.</div>';DRAIN.forEach((x,i)=>body+=drainRow(s,i,x));body+=`<div class="card" style="box-shadow:none"><div class="checktext"><b>Outro item — linha adicional existente na ficha</b></div><input style="margin-top:6px" value="${esc(s.other)}" oninput="setSecText('other',this.value)"><div class="sectionTools"><button class="btn small" onclick="dictate('other')">Ditar Outro</button></div><div class="row"><label class="checkline"><input type="checkbox" ${s.subs['d_other_m']?'checked':''} onchange="setSub('d_other_m',this.checked)"><span>Manutenção</span></label><label class="checkline"><input type="checkbox" ${s.subs['d_other_i']?'checked':''} onchange="setSub('d_other_i',this.checked)"><span>Implantar</span></label></div>${itemExtraHtml(2,'d_other','Outro item')}</div>`}
if(n===3){body=plateHtml(f)}
if(n===4){DEPOSIT.forEach((x,i)=>body+=checkHtml(s,'d'+i,x));body+=blankOptionHtml(s,'d_blank1','d_blank1_text','Linha em branco 1 da ficha');body+=blankOptionHtml(s,'d_blank2','d_blank2_text','Linha em branco 2 da ficha');body+=obsHtml(n)}
if(n===5){FRONT.forEach((x,i)=>{if(FRONT_SUB[i]){body+=`<div class="checktext" style="padding:10px 2px 3px"><b>${esc(x)}</b></div>`+subHtml(s,i,FRONT_SUB[i])}else body+=checkHtml(s,'f'+i,x)});body+=`<div class="checkline"><input type="checkbox" ${s.checks['f_outros']?'checked':''} onchange="setCheck('f_outros',this.checked)"><div style="flex:1"><div class="checktext">Outros:</div><textarea style="margin-top:6px" oninput="setSecText('other',this.value)">${esc(s.other)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictate('other')">Ditar Outros</button></div></div></div>`}
if(n===6){EQUIP_SIMPLE.forEach((x,i)=>body+=checkHtml(s,'e'+i,x));EQUIP_DETAIL.forEach((x,i)=>body+=detailCheckHtml(s,i,x));body+=obsHtml(n)}
if(n===7){TALUDE.forEach((x,i)=>{body+=checkHtml(s,'t'+i,x);if(i===11)body+=`<input placeholder="Especificar Outros" value="${esc(s.other)}" oninput="setSecText('other',this.value)"><div class="sectionTools"><button class="btn small" onclick="dictate('other')">Ditar Outros</button></div>`});body+=`<label>Recomendações:</label><textarea oninput="setSecText('recommendations',this.value)">${esc(s.recommendations)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictate('recommendations')">Ditar recomendações</button></div>`}
if(n===8){body+=radioPair('explosivesUse','Utiliza','Não utiliza',s.details.explosivesUse||'');body+=`<div class="checktext" style="padding:12px 2px 3px"><b>${esc(EXPLOSIVES[0])}</b></div><div class="subopts">`;EXPLOSIVES.slice(1).forEach((x,j)=>body+=checkHtml(s,'x'+(j+1),x));body+='</div>'+obsHtml(n)}
if(n===9){body+=radioPair('paiolPossui','Possui','Não possui',s.details.paiolPossui||'');PAIOL.forEach((x,i)=>{if(i===1){body+=`<div class="checktext" style="padding:12px 2px 3px"><b>${esc(x)}</b></div>`+subHtml(s,'paiol_ext',['Sem','vencido.'])}else body+=checkHtml(s,'p'+i,x)});body+=obsHtml(n)}
if(n===10){body=trafficHtml(f)+obsHtml(n)}
if(n===11){body=`<label>11. DETERMINAÇÕES</label><textarea style="min-height:300px" oninput="setDeterminations(this.value)">${esc(f.determinations)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictateSpecial('determinations')">Ditar determinações</button></div>`}
if(n===12){body=`<label>12. PROVIDÊNCIAS</label><textarea style="min-height:300px" oninput="setProvidences(this.value)">${esc(f.providences)}</textarea><div class="sectionTools"><button class="btn small" onclick="dictateSpecial('providences')">Ditar providências</button></div><div class="sep"></div><div class="sigrow"><div><label>Técnico</label><input value="${esc(f.signatures.technician)}" oninput="setSignature('technician',this.value)"><button class="btn small" style="margin-top:5px" onclick="dictateSignature('technician')">Ditar</button></div><div><label>Data</label><input type="date" value="${esc(fmtDate(f.signatures.technicianDate))}" oninput="setSignature('technicianDate',this.value)"></div><div><label>Assinatura</label><input value="${esc(f.signatures.technicianSignature)}" oninput="setSignature('technicianSignature',this.value)"><button class="btn small" style="margin-top:5px" onclick="dictateSignature('technicianSignature')">Ditar</button></div></div><div class="sigrow"><div><label>Recebido por</label><input value="${esc(f.signatures.receivedBy)}" oninput="setSignature('receivedBy',this.value)"><button class="btn small" style="margin-top:5px" onclick="dictateSignature('receivedBy')">Ditar</button></div><div><label>Data</label><input type="date" value="${esc(fmtDate(f.signatures.receivedDate))}" oninput="setSignature('receivedDate',this.value)"></div><div><label>Assinatura</label><input value="${esc(f.signatures.receivedSignature)}" oninput="setSignature('receivedSignature',this.value)"><button class="btn small" style="margin-top:5px" onclick="dictateSignature('receivedSignature')">Ditar</button></div></div>`}
let h=`<div class="card"><div class="sectionName">${n}. ${esc(SECTION_NAMES[n])}</div></div><div class="card">${body}${evidenceHtml(n)}</div>`;document.getElementById('app').innerHTML=h;footer(`<button class="btn" onclick="go('grid',{formId:'${f.id}'})">Voltar à grade</button><button class="btn primary" onclick="completeSection(${n})">Salvar e concluir este item</button>`)}
function drainRow(s,i,label){return `<div class="card" style="box-shadow:none"><div class="checktext" style="padding:4px 2px 8px"><b>${esc(label)}</b></div><div class="row"><label class="checkline"><input type="checkbox" ${s.subs['dr'+i+'_m']?'checked':''} onchange="setSub('dr${i}_m',this.checked)"><span>Manutenção</span></label><label class="checkline"><input type="checkbox" ${s.subs['dr'+i+'_i']?'checked':''} onchange="setSub('dr${i}_i',this.checked)"><span>Implantar</span></label></div>${itemExtraHtml(2,'dr'+i,label)}</div>`}
function detailCheckHtml(s,i,label){return `<div class="checkline"><input type="checkbox" ${s.checks['ed'+i]?'checked':''} onchange="setCheck('ed${i}',this.checked)"><div style="flex:1"><div class="checktext">${esc(label)}</div><input style="margin-top:6px" value="${esc(s.details['ed'+i]||'')}" oninput="setDetail('ed${i}',this.value)" placeholder="Complemento"><div class="sectionTools"><button class="btn small" onclick="dictateDetail('ed${i}')">Ditar complemento</button></div></div></div>`}
function blankOptionHtml(s,checkKey,detailKey,label){return `<div class="checkline"><input type="checkbox" ${s.checks[checkKey]?'checked':''} onchange="setCheck('${checkKey}',this.checked)"><div style="flex:1"><div class="checktext">${esc(label)}</div><input style="margin-top:6px" value="${esc(s.details[detailKey]||'')}" oninput="setDetail('${detailKey}',this.value)" placeholder="Preencher, se utilizado"><div class="sectionTools"><button class="btn small" onclick="dictateDetail('${detailKey}')">Ditar texto</button></div></div></div>`}
function radioPair(key,a,b,val){return `<div class="row"><label class="checkline"><input type="radio" name="${key}" value="${esc(a)}" ${val===a?'checked':''} onchange="setDetail('${key}',this.value)"><span>${esc(a)}</span></label><label class="checkline"><input type="radio" name="${key}" value="${esc(b)}" ${val===b?'checked':''} onchange="setDetail('${key}',this.value)"><span>${esc(b)}</span></label></div>`}
