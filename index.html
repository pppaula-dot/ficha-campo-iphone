<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ficha Campo"><link rel="manifest" href="./manifest.webmanifest"><title>Ficha Campo</title><style>body{font-family:Arial,sans-serif;margin:0;padding:28px 18px;background:#f4f5f7;color:#202124}.box{max-width:560px;margin:60px auto;background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px}.muted{color:#6b7280}</style></head><body><div class="box"><h2>Ficha Campo</h2><p id="st">Abrindo aplicativo…</p><p class="muted">No primeiro acesso, mantenha internet até a tela principal abrir.</p></div><script>(async()=>{const files=["./app-parts/part-01.b64","./app-parts/part-02.b64","./app-parts/part-03.b64","./app-parts/part-04.b64","./app-parts/part-05.b64","./app-parts/part-06.b64","./app-parts/part-07.b64","./app-parts/part-08.b64","./app-parts/part-09.b64"];try{const r=await Promise.all(files.map(async f=>{const x=await fetch(f,{cache:'no-store'});if(!x.ok)throw new Error(f);return (await x.text()).trim();}));const b=atob(r.join(''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=new TextDecoder('utf-8').decode(u);document.open();document.write(html);document.close();}catch(e){document.getElementById('st').textContent='Não foi possível abrir. Conecte à internet e tente novamente.';console.error(e);}})();</script></body></html>
